[package]
name = "walter"
version = "0.1.0"
edition = "2024"
description = "Walter, the patrol windup: finds unfinished work in the shared database and calls the right windup back"
license.workspace = true
repository.workspace = true

[dependencies]
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
windups.workspace = true

[dev-dependencies]
tempfile = "3"
