[package]
name = "larry"
version = "0.1.0"
edition = "2024"
description = "Larry, the hashing windup: exact, partial and look-alike fingerprints of media files"
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1.8.7"
rusqlite = "0.43"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
windups.workspace = true

[dev-dependencies]
tempfile = "3"
