[package]
name = "windups"
version = "0.1.0"
edition = "2024"
description = "Shared library for all windups: settings, media.db, raw archive"
license.workspace = true
repository.workspace = true

[dependencies]
rusqlite = { version = "0.43", features = ["bundled", "backup", "fallible_uint"] }
# already in the tree (via ureq); the pure-Rust miniz backend; for event-log batches
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
toml = "1"

[dev-dependencies]
tempfile = "3"
