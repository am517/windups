# Jack settings. The running config is config.toml in Jack's data folder
# (macOS: "~/Library/Application Support/Windups/jack/config.toml",
# Linux: ~/.local/share/windups/jack/config.toml), or --config <path>.
# Per-file values (name, year, ids) are flags. Embedded tags count the same way.
# Jack reports facts. He does not tag, embed art, or sort files.
# Priority: command-line flags > this file.


# ── Files ─────────────────────────────────────────────────────────

# File types to look for.
extensions = ["mp4", "m4v", "mkv", "mov", "avi"]

# Look inside subfolders.
recursive = true


# ── Run ───────────────────────────────────────────────────────────

# "auto", "tv" or "movie".
type = "auto"

# Show what would happen without changing anything.
dry_run = false

# Print the facts. Jack still always says what he did.
print = false


[tagger]

# MP4 tag writer: "atomicparsley" or "exiftool".
mp4_tool = "atomicparsley"

# Tool names or paths.
atomicparsley = "AtomicParsley"
exiftool = "exiftool"
mkvpropedit = "mkvpropedit"
mkvextract = "mkvextract"
mkvmerge = "mkvmerge"

# Which files each tool handles.
mp4_extensions = ["mp4", "m4v", "mov"]
mkv_extensions = ["mkv"]

# Longer descriptions also go in the long description.
short_description_max = 250

# ── Artwork ──

# Download and embed art (replaces existing art).
embed_artwork = true

# Art saved with --download-only: "<filename><poster_suffix>" (otherwise a temp file).
poster_suffix = ".poster.jpg"

# "poster" or "landscape".
art_style = "poster"

# What to try if a style has no art.
art_fallback = { poster = ["poster", "landscape"], landscape = ["landscape", "poster"] }

# TV posters, in order: "season", "series".
tv_poster = ["season", "series"]

# TV landscape art, in order: "still" (episode), "backdrop" (show).
tv_landscape = ["still", "backdrop"]

# Cover name inside MKV files.
mkv_cover_name = "cover.jpg"

# ── Choose art (--ask-art) ──

# Download all available art, list it and ask which to use.
ask_art = false

# Most images to show.
ask_art_max = 20

# Open the image folder while asking (default: on for macOS only).
# ask_art_open_folder = true
ask_art_open_command = "open"

# Keep the image folder afterwards.
ask_art_keep = false

# ── Extra tags ──

# Write the content rating (e.g. PG-13) on MP4 files.
mp4_content_rating = true

# Namespace for the MP4 custom tags below.
id_domain = "com.apple.iTunes"

# Custom tags: metadata key = tag name. Database ids are read back on later runs.
[tagger.mp4_id_tags]
imdb_id = "IMDB_ID"
tmdb_id = "TMDB_ID"
thetvdb_id = "TVDB_ID"
tmdb_series_id = "TMDB_SERIES_ID"
tmdb_episode_id = "TMDB_EPISODE_ID"
thetvdb_series_id = "TVDB_SERIES_ID"
thetvdb_episode_id = "TVDB_EPISODE_ID"
rating_imdb = "IMDB_RATING"
rating_rotten_tomatoes = "ROTTEN_TOMATOES"
rating_metacritic = "METACRITIC"
rated = "RATED"
awards = "AWARDS"
original_title = "ORIGINAL_TITLE"
original_show = "ORIGINAL_SHOW"
original_episode_title = "ORIGINAL_EPISODE_TITLE"

[tagger.mkv_id_tags]
imdb_id = "IMDB"
tmdb_id = "TMDB"
thetvdb_id = "TVDB"
tmdb_series_id = "TMDB_SERIES"
tmdb_episode_id = "TMDB_EPISODE"
thetvdb_series_id = "TVDB_SERIES"
thetvdb_episode_id = "TVDB_EPISODE"
rating_imdb = "IMDB_RATING"
rating_rotten_tomatoes = "ROTTEN_TOMATOES_RATING"
rating_metacritic = "METACRITIC_RATING"
rated = "LAW_RATING"
awards = "AWARDS"
original_title = "ORIGINAL_TITLE"
original_show = "ORIGINAL_SHOW"
original_episode_title = "ORIGINAL_EPISODE_TITLE"


[providers]

# Databases to use, in order. OMDb adds ratings and is skipped without a key.
# wikidata, tvmaze, itunes and youtube run after the others and reuse the ids they found.
order = ["tmdb", "thetvdb", "omdb", "wikidata", "tvmaze", "itunes", "youtube"]

# Main language (2 letters).
language = "en"

# Also keep names in the original language.
keep_original = true

# Add " (year)" to TV show names.
tv_show_year = false

# Add "Original title: ..." to the description.
original_in_description = false

# Genres: "lower", "title" or "asis" case, joined with genre_separator.
genre_case = "lower"
genre_separator = ","

# Genres are compared lowercase with '-'/'_' as spaces ("Science-Fiction" = "science fiction").
# Aliases map such a normalized name to the one to keep.
# An alias may name several genres, comma-separated.
genre_aliases = { "sci fi" = "science fiction", "scifi" = "science fiction", "sci fi & fantasy" = "science fiction, fantasy", "action & adventure" = "action, adventure", "war & politics" = "war, politics" }

# 2-letter to 3-letter language codes (for TheTVDB).
language_codes = { en = "eng", ja = "jpn", fr = "fra", de = "deu", es = "spa", it = "ita", pt = "por", ko = "kor", zh = "zho", ru = "rus", nl = "nld", sv = "swe" }

[providers.tmdb]

# Key from https://www.themoviedb.org/settings/api (read_token or api_key).
read_token = ""
api_key = ""

# When both are empty, read them from these environment variables. Empty = off.
read_token_env = "TMDB_ACCESS_TOKEN"
api_key_env = "TMDB_API_KEY"

language = "en-US"

# Preferred language for backdrops.
image_language = "en"

# Sizes: w92 … w780 or "original" (backdrops w300 w780 w1280; stills w92 w185 w300).
poster_size = "original"
backdrop_size = "original"
still_size = "original"

base_url = "https://api.themoviedb.org/3"
image_base = "https://image.tmdb.org/t/p"

[providers.thetvdb]

# Key from https://thetvdb.com/api-information (pin only if your key needs one).
api_key = ""

# When api_key is empty, read the key from this environment variable. Empty = off.
api_key_env = "THETVDB_API_KEY"
pin = ""

# 3-letter language; empty uses [providers] language.
language = ""

# Preferred language for background art.
image_language = "eng"

# "full" or "thumbnail".
poster_size = "full"

base_url = "https://api4.thetvdb.com/v4"

[providers.omdb]

# Key from https://www.omdbapi.com/apikey.aspx.
api_key = ""

# When api_key is empty, read the key from this environment variable. Empty = off.
api_key_env = "OMDB_API_KEY"

# "short" or "full".
plot = "short"

base_url = "https://www.omdbapi.com/"

[providers.wikidata]

# Cross-ids, franchise and series groupings. Looked up only by a known id.
base_url = "https://www.wikidata.org/w/api.php"
language = "en"

[providers.wikipedia]

# Article summary, used only when no provider gave a description.
enabled = true
base_url = "https://en.wikipedia.org/api/rest_v1"

[providers.tvmaze]

# Free TV data, no key.
base_url = "https://api.tvmaze.com"

[providers.itunes]

# iTunes Search API, no key: high-resolution art.
base_url = "https://itunes.apple.com/search"
country = "US"
art_size = "3000x3000bb"
limit = 5

[providers.youtube]

# Trailer link. Key from https://console.cloud.google.com (YouTube Data API v3). No key = skipped.
# Free quota is about 100 searches a day; Jack searches each title at most once per run.
api_key = ""

# When api_key is empty, read the key from this environment variable. Empty = off.
api_key_env = "YOUTUBE_API_KEY"
base_url = "https://www.googleapis.com/youtube/v3"
search_suffix = "trailer"
watch_url = "https://www.youtube.com/watch?v="


[merge]

# For each field, use the first database in its list that has a value.
default = ["tmdb", "thetvdb", "omdb"]

# Fields where the longest value wins instead (ties: the list order).
longest = ["description"]

[merge.fields]
episode_title = ["thetvdb", "tmdb"]
description = ["tmdb", "thetvdb", "omdb"]
poster_url = ["tmdb", "thetvdb", "omdb"]
season_poster_url = ["tmdb", "thetvdb"]
backdrop_url = ["tmdb", "thetvdb"]
still_url = ["tmdb", "thetvdb"]
rating_imdb = ["omdb"]
rating_rotten_tomatoes = ["omdb"]
rating_metacritic = ["omdb"]
rated = ["omdb"]
awards = ["omdb"]


[matching]

# Sources whose years differ by at most this much are taken to agree (a release can be a year apart
# in different countries). Only a hint for matching; a year never proves identity, only an id does.
year_tolerance = 1

# Accept a title only when it is the single result at or above this score (0 to 1).
fuzzy_threshold = 0.90

# A found record more than this many years from your --year is a different work, and the file
# is left unresolved (0 = the exact year). 1 allows a release a year apart in another country.
user_year_tolerance = 1

# Consensus: accept a match when at least this many found sources confirm it and no found
# source names a different work. Sources that found nothing count neither way.
min_confirming = 1

# How titles are read from file names (regular expressions).
separators = '[._]+'

tv_patterns = [
  '(?i)^(?P<show>.*?)[ \-]*S(?P<season>\d{1,2})[ \-]*E(?P<episode>\d{1,3})',
  '(?i)^(?P<show>.*?)[ \-]*(?P<season>\d{1,2})x(?P<episode>\d{2,3})\b',
]

movie_patterns = [
  '^(?P<title>.+)[ \-]*[(\[](?P<year>(?:19|20)\d{2})[)\]]',
  '^(?P<title>.+?)[ \-]*[(\[]?(?P<year>(?:19|20)\d{2})[)\]]?(?:\s|$)',
]

# Removed from titles (release tags etc.).
cleanup = [
  '(?i)\b(2160p|1080p|720p|480p|4k|uhd|hdr|bluray|blu-ray|brrip|web-?dl|webrip|hdtv|dvdrip|x264|x265|h\.?264|h\.?265|hevc|aac|ac3|dts|remux|proper|repack)\b.*$',
  '\[[^\]]*\]',
]

# No show name in a TV file name: use the folder name.
show_from_parent_dir = true

# No episode title found: use the text after SxxExx in the file name.
episode_title_from_filename = true


[naming]

# Language for file and folder names: "original" or a 2-letter code.
file_language = "original"
folder_language = "en"

# Longest file or folder name (extension kept; 0 = no limit).
filename_max = 255

# Unit for filename_max: "chars", "bytes", or "auto" (chars on macOS, bytes on Linux).
filename_unit = "auto"


[sort]

# Files are moved ONLY with -o / output, or when this is true.
enabled = false

# "move" or "copy".
mode = "move"

# Top folders (-o replaces both).
tv_root = "~/TV"
movie_root = "~/Movies"

# Names. Use any metadata key in {}: {title} {year} {show} {season} {episode} {episode_title} {ext} …
# _en = main language, _file / _folder = [naming] languages. {season:02} pads to 2 digits.
movie_template = "{movie_root}/{title_en}/{title_file} ({year}).{ext}"
tv_template = "{tv_root}/{show_en} ({show_year})/Season {season}/{show_file} S{season:02}E{episode:02} - {episode_title_file}.{ext}"

# Characters not allowed in names, and their replacement.
illegal_chars = '/\:*?"<>|'
replacement = "-"


[store]

# The shared catalog (media.db): Jack's objective records reach it by sync, once
# [relationships] database is set (or a legacy [archive] sync_target is still present).
enabled = true

# media.db path; empty = the shared windups setting (~/.config/windups/windups.toml, database).
database = ""

# Seconds to wait for a busy database before giving up.
busy_timeout_secs = 5

# Names of other windups this one knows. All optional and empty by default; nothing is
# hardcoded. Flora writes assistant on install; Jack asks the assistant for the matchmaker,
# then the matchmaker for database and llm, and saves what he learns. If nobody can be
# reached he proceeds alone.
[relationships]
assistant = ""
matchmaker = ""
database = ""
llm = ""

[archive]

# Jack's own database: every record he makes is kept here first (all data, including summaries
# and images), and stays here after the database windup has a copy of the objective facts.
# Empty = jack.db beside this config file (Jack's folder). If the database windup can't be reached,
# the record just waits here.
database = ""

# Seconds to wait for a busy jack.db before giving up.
busy_timeout_secs = 5

# Records sent to the sync target at a time (smaller = less memory while syncing).
sync_batch = 32

# Legacy: who gets copies. Prefer [relationships] database. Empty or "none" = no target.
# With [store] enabled = false, nothing is synced either. Records always stay in jack.db.
sync_target = ""

# How the database windup is reached: "library" (in-process catalog receive) or "socket"
# (a running `daniel serve`, or later any windup that speaks the same protocol).
sync_transport = "library"
# Empty = daniel.sock inside Daniel's data folder (the path has a space on macOS; Jack builds it
# as a path, not a shell string). Set a path to point somewhere else.
daniel_socket = ""
socket_timeout_secs = 30
max_frame_bytes = 16777216

# Record ids: "content" = an identical re-run is the same record; "per_run" = every run makes new ones.
id = "content"

# The shared core (every windup has these; see windups/COMMANDS.md and windups/CULTURE.md).
[core]
# Jack's personality (style and priorities, never an exception to CULTURE.md). Empty = PROFILE.toml's.
personality = ""

[core.events]
# Newest events kept whole, events per compressed batch, batches kept before the oldest is summarized
# (only once a backup holds the originals), and the compression level (0-9).
keep_full = 50000
batch_size = 5000
keep_batches = 200
level = 6

[core.snapshots]
# Folder for checked snapshots; empty = backups/ inside Jack's own data folder.
dir = ""
# Snapshots kept (any holding the originals of summarized events are always kept).
keep = 14
# Backup copy speed: pages per step and the pause between steps (milliseconds).
pages_per_step = 256
pause_ms = 0
# Health and the audit call the newest snapshot stale after this many days.
stale_after_days = 7

[core.talk.synonyms]
# Extra words for `jack talk`, e.g. backup = ["stash"]

[candidates]
# When Jack can't decide, he lists the candidates grouped by source, numbered across the list.
# You pick at most one per source (numbers separated by spaces, Enter for none); picked ones count
# as confirming sources, unpicked ones are ignored. `--pick "1 6"` gives the picks without a prompt.
# Ask on a terminal only (never in a pipe or for another windup).
ask = true
# Keep at most this many hits from each source's search list (e.g. tmdb:search).
per_source = 5

[embedded]
# Read the file's own metadata first; it is the truth for facts (not wording) and always kept as
# source "embedded". A source's value replaces it only when written the same way or when independent
# evidence (an id, or the user's own word: --name/--year or channel mapping) confirms the same entity; similar
# wording is not proof. Otherwise the file's value stays, a conflict is recorded and the item stays open.
enabled = true

# Container tag (lowercase, as ffprobe reports it) -> Jack field.
[embedded.tags]
title = "title"
show = "show"
tvshow = "show"
season_number = "season"
episode_sort = "episode"
episode_id = "episode_title"
date = "date"
year = "year"
description = "description"
synopsis = "description"
comment = "comment"
genre = "genre"
imdb_id = "imdb_id"
imdb = "imdb_id"
tmdb_id = "tmdb_id"
tmdb = "tmdb_id"
thetvdb_id = "thetvdb_id"
tvdb_id = "thetvdb_id"
tvdb = "thetvdb_id"
wikidata_id = "wikidata_id"
wikidata = "wikidata_id"
wikipedia = "wikipedia"
youtube = "youtube"

[online]
# Online videos (YouTube, X). Jack reads the label first: the yt-dlp .info.json beside the file,
# then a URL in the file's tags, then a YouTube id in the name. No YouTube search here (quota).
enabled = true
readers = ["info_json", "embedded", "filename"]
info_json_suffix = ".info.json"
ffprobe = "ffprobe"
embedded_tags = ["comment", "purl", "description", "synopsis", "url"]
filename_id_pattern = '\[([A-Za-z0-9_-]{11})\]\.[A-Za-z0-9]+$'
# Is the channel also a show? Merged only when exactly one TMDB show has exactly its name;
# several exact names = stored as unresolved with all candidates, not tagged. No guessing.
crossover_providers = ["tmdb"]
crossover_keys = ["show", "tmdb_series_id", "thetvdb_series_id", "imdb_id", "genre", "network"]

[explain]
# What Jack tells you about each item he could not settle (per item, and again at the end of the
# run). Static templates, one per unresolved reason; placeholders {file}, {reason}, {detail}.
# Sammy (an LLM windup) can replace these with thoughtful explanations later.
fallback = "I couldn't figure it out. Please give more context: an id (--imdb, --tmdb, or --thetvdb) lets me trust a single result; --year can narrow several works with the same name, but is not enough on its own. ({reason})"

[explain.templates]
review_flag = "{file}: the reviewer flagged {detail}. Check it and fix with flags if needed."
no_match = "I couldn't figure it out: no source has an exact match. Please give an id (--imdb, --tmdb, or --thetvdb), or more context such as --year to narrow the search."
ambiguous = "I couldn't figure it out: more than one work matches. --year can narrow it; an id (--imdb, --tmdb, or --thetvdb) lets me trust a single result."
needs_flags = "I couldn't figure it out: I don't have enough to be sure of a single match. Another source must agree, or give an id (--imdb, --tmdb, or --thetvdb). --year can narrow several works with the same name, but is not enough on its own."
needs_judgment = "Sources agree this is the same work, but their names or dates differ. I need the LLM windup (if configured) or an id. Left incomplete."
source_error = "A source failed: {detail}. Jack will retry on a later run (network or quota)."
conflict = "Sources disagree: {detail}. Kept the file's own values; recorded for review."
id_not_found = "The id you gave was not found: {detail}. Check the id (and --type movie or --type tv); I did not search by title instead."
year_mismatch = "A source found a different year than the one you gave: {detail}. Nothing was accepted; check --year or give the id of the right work."
sources_disagree = "Sources found different works: {detail}. Nothing was accepted; give the id of the right work."
too_few_sources = "Not enough sources confirm it: {detail}."
needs_llm_windup = "Needs judgement. Kept for the LLM windup (if configured) or for you to decide with an id (--imdb, --tmdb, or --thetvdb)."

[review]
# Optional post-run review pass (needs Sammy; skipped while none runs). One field at a time across all
# items, in chunks, with minimal context. The reviewer only flags; nothing is rewritten. Flags are
# logged with provenance and reported as open items (review_flag).
enabled = false
fields = ["title", "show", "year", "date", "description"]
chunk = 20
default_context = ["title", "year"]

[review.context]
description = ["title", "show", "year"]
title = ["year", "kind"]
show = ["year", "kind"]

# What an entry needs before it is "complete" (it must also be id-verified with nothing open).
# Kinds not listed use default_required. Optional fields are filled when known, never required.
[completeness]
default_required = ["title"]

[completeness.required]
movie = ["title", "year"]
episode = ["show", "season", "episode", "episode_title"]
show = ["show", "year"]
online_video = ["title", "channel", "date"]

[completeness.optional]
movie = ["genre", "cast", "director", "runtime", "description", "poster_url"]
episode = ["cast", "air_date", "runtime", "description"]
show = ["cast", "network", "description"]
online_video = ["duration", "thumbnail_url", "description"]

