# Jack's profile: the source of truth for who Jack is and what Jack does.
# `jack --capabilities` prints this file. It is also stored (and embedded for meaning search)
# in media.db's windups table so Margaret and other windups can find Jack.
name = "jack"
role = "metadata"
summary = "Jack is the boss of all metadata. He reads a media file's own label first, looks it up in online databases, keeps everything he finds, and acts only on sure decisions."
purpose = "Know what every media file is, from the file's own facts and online sources, without ever guessing."
status = "active"
kinds = ["movie", "episode", "online_video"]
later_kinds = ["book", "document"]
sources = ["embedded", "tmdb", "thetvdb", "omdb", "tvmaze", "wikidata", "itunes", "youtube", "wikipedia", "yt-dlp info.json"]
reads = ["media files", "yt-dlp .info.json"]
writes = ["jack.db (his own archive of every handoff record, with its sync state to Walter)", "media.db (media, candidates, texts, art, ids, ratings, names, conflicts, unresolved, decisions, lifecycle stages and history, full search lists, works and their ids, last_checked; all via the Daniel handoff: Daniel stores, Larry hashes, Ruth builds the reference)", "file tags (fallback until Lauren)", "sorted folders (fallback until Sally)"]
never = ["guess between candidates", "overwrite a source's data", "tag from an unresolved decision", "replace the file's own facts without independent evidence", "silently drop an item", "merge entries on a fingerprint hint"]
hands_off = ["sammy: any step still ambiguous (parse, lookup, match, refine, conflict) via the Escalation trait; decisions recorded with provenance", "user: needs_flags items (--year, --imdb)"]
command = "jack [--capabilities] [--tmdb ID | --thetvdb ID | --imdb ID | --youtube ID | --x ID | --name NAME --year YEAR] PATH..."

[[success_checks]]
check = "every file processed gets exactly one entry handed to Daniel"
test = "jack/src/run.rs::nothing_dropped_everything_explained"

[[success_checks]]
check = "no guesses: an unsettled choice is stored as not_identified with all candidates and a reason"
test = "jack/src/decide.rs::acts_only_on_sure_information"

[[success_checks]]
check = "only an id (from the file or a confirmed match) moves an entry to complete"
test = "jack/src/stage.rs::only_an_id_reaches_complete"

[[success_checks]]
check = "every source answer is kept as a candidate, never overwritten"
test = "jack/src/candidates.rs::whole_lists_kept"

[[success_checks]]
check = "every record is kept in Jack's own jack.db as handoff JSON v1; with no database nothing is written beside the media"
test = "jack/src/daniel.rs::no_database_keeps_the_record_in_jack_db_and_writes_no_json"

[[success_checks]]
check = "a record is marked synced only after Walter acknowledges it; retries never duplicate and Jack keeps his records"
test = "jack/src/walter.rs::failed_send_leaves_unsynced_and_retry_does_not_duplicate"
